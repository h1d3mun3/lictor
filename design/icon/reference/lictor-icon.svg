  <circle cx="512" cy="512" r="290" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="56"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="#FF5A1F" stroke-width="56" stroke-dasharray="1215 1822" transform="rotate(-90 512 512)" opacity="0.75" filter="url(#blur)"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="#FF6A2E" stroke-width="52" stroke-dasharray="1215 1822" transform="rotate(-90 512 512)"/>
  <circle cx="512" cy="512" r="314" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
  <g filter="url(#shadow)">
